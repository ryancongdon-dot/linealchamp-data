name: Probe jhowell.net reachability (temporary diagnostic)

# One-off check: is jhowell.net's historical CFB scores site reachable from
# GitHub Actions runners? (ESPN's site API turned out to be blocked from both
# the dev sandbox AND GH Actions runners earlier this session, so we're
# verifying rather than assuming.) This workflow makes no changes to any
# league data — it only fetches and prints. Delete this file once the
# question is answered either way.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check index page reachability
        run: |
          echo "=== HEAD ScoresIndex.htm ==="
          curl -sS -I --max-time 20 "https://www.jhowell.net/cf/scores/ScoresIndex.htm" || echo "CURL FAILED (index)"
      - name: Fetch index page and show year-link patterns
        run: |
          echo "=== GET ScoresIndex.htm (first 200 lines) ==="
          curl -sS --max-time 20 "https://www.jhowell.net/cf/scores/ScoresIndex.htm" | head -200 || echo "CURL FAILED (index body)"
      - name: Try a guessed per-year URL (1950)
        run: |
          echo "=== HEAD guessed 1950scores.htm ==="
          curl -sS -I --max-time 20 "https://www.jhowell.net/cf/scores/1950scores.htm" || echo "CURL FAILED (1950 guess)"
