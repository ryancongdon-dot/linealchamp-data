name: Refresh lineal data

# Daily FULL rebuild for every league whose source is a fast, reliable feed.
# Now that these sources are committed CSVs / clean APIs (not slow scrapes), a
# full rebuild costs seconds, so we just re-run build_lineage + upload_to_worker
# each day. Unlike the old incremental path, this also refreshes the complete
# game log — so the "what if?" cascade stays current too, not just the belt.
#
# Leagues:
#   EPL  football-data.co.uk CSVs                (current)
#   CFB  collegefootballdata API                 (current)
#   MLB  Retrosheet + MLB StatsAPI                (current)
#   NFL  538 (1920-1998) + nflverse (1999+)       (current)
#   NBA  538 (1946-2015 Finals) + ESPN (2015+)    (current)
#   NHL  ESPN only, seeded at the 2021-22 season  (current; not yet 1917+)
#
# NBA/NHL's ESPN halves have a fail-fast circuit breaker (sources/nba.py,
# sources/nhl.py): if ESPN is unreachable, the fetch bails out after a run of
# consecutive failures rather than hanging, and the build falls back to
# whatever historical base it has (538 for NBA) or reports "no games" (NHL,
# which currently has no historical base — the MIN_CHANGES floor then blocks
# the upload rather than shipping an empty chain).
#
# The MIN_CHANGES floor in upload_to_worker refuses to overwrite good data with
# a gutted chain if a source ever hiccups, so a bad fetch fails safe.
#
# Required repository secrets:
#   CFBD_API_KEY   collegefootballdata.com key (CFB)
#   ADMIN_SECRET   the Worker's env.ADMIN_SECRET (authorizes the KV upload)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily — after US games finish

concurrency: refresh-data

jobs:
  refresh:
    strategy:
      fail-fast: false        # one league's hiccup must not block the others
      matrix:
        league: [EPL, CFB, MLB, NFL, NBA, NHL]
    runs-on: ubuntu-latest
    timeout-minutes: 60   # CFB's cold rebuild (per-season CFBD calls) and NBA/NHL's
                          # per-team-season ESPN fetch need headroom to fully warm
                          # their caches; EPL/NFL/MLB finish in seconds.
    defaults:
      run:
        working-directory: linealchamp-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: linealchamp-data/cache/${{ matrix.league }}
          key: source-cache-v2-${{ matrix.league }}-${{ github.run_id }}
          restore-keys: |
            source-cache-v2-${{ matrix.league }}-
      - run: pip install -r requirements.txt
      - name: Build lineage (${{ matrix.league }})
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python build_lineage.py --leagues ${{ matrix.league }}
      - name: Upload to Worker KV (${{ matrix.league }})
        if: ${{ !cancelled() }}
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: python upload_to_worker.py --leagues ${{ matrix.league }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: linealchamp-data/cache/${{ matrix.league }}
          key: source-cache-v2-${{ matrix.league }}-${{ github.run_id }}
