name: Refresh lineal data

# Rebuilds each league's lineage and pushes it to the Worker's KV. Runs
# nightly (09:17 UTC) and by hand from the Actions tab ("Run workflow").
#
# Two job groups:
#   refresh-bdl   — NBA and EPL, which share ONE balldontlie API key.
#                   max-parallel: 1 so they never compete for the same rate
#                   limit (running them concurrently starved EPL into a
#                   4-hour timeout while NBA got a shredded partial fetch).
#   refresh-other — MLB, NHL, CFB in parallel (independent sources).
#
# Cache is a restore/save PAIR with `if: always()` on the save — NOT the
# cache action's post-step or the deprecated save-always flag, because
# neither runs when a job is killed by timeout. This way a timed-out run
# still banks every year it fetched and the next run resumes from there.
#
# The upload script refuses to ship a lineage far smaller than the league's
# known-good size (MIN_CHANGES in upload_to_worker.py), so an incomplete
# fetch can never again overwrite good site data.
#
# Required repository secrets:
#   BDL_API_KEY    balldontlie key (NBA + EPL)
#   CFBD_API_KEY   collegefootballdata.com key (CFB)
#   ADMIN_SECRET   the Worker's env.ADMIN_SECRET (authorizes the KV upload)

on:
  workflow_dispatch:
  # WEEKLY, not nightly. This account has 2,000 free Actions minutes/month;
  # a nightly full rebuild (especially EPL, which the rate-limited balldontlie
  # endpoint drags out for hours) blew the entire budget in ~2 weeks. Day-to-day
  # currency is already handled for free by the Worker's own Cloudflare cron
  # (today's games for the current champ); this offline rebuild only needs to
  # catch completed seasons and corrections, so once a week on Monday is plenty.
  schedule:
    - cron: "17 9 * * 1"

concurrency: refresh-data

jobs:
  refresh-bdl:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        league: [NBA, EPL]
    runs-on: ubuntu-latest
    # Hard budget cap. A warm cache finishes in ~2 min; a cold one is far
    # longer, but letting EPL grind for hours against the rate limit is exactly
    # what drained the monthly minutes. Cap it: whatever it fetches is banked
    # to the cache (save step runs on timeout), so a capped run still makes
    # forward progress and the next weekly run resumes where it left off.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: linealchamp-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: linealchamp-data/cache/${{ matrix.league }}
          key: source-cache-v1-${{ matrix.league }}-${{ github.run_id }}
          restore-keys: |
            source-cache-v1-${{ matrix.league }}-
      - run: pip install -r requirements.txt
      - name: Build lineage (${{ matrix.league }})
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: python build_lineage.py --leagues ${{ matrix.league }}
      - name: Upload to Worker KV (${{ matrix.league }})
        if: ${{ !cancelled() }}
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: python upload_to_worker.py --leagues ${{ matrix.league }}
      # Bank fetched data even when the job fails or times out.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: linealchamp-data/cache/${{ matrix.league }}
          key: source-cache-v1-${{ matrix.league }}-${{ github.run_id }}

  refresh-other:
    strategy:
      fail-fast: false
      matrix:
        # NFL is deliberately excluded: its live chain (1933 Bears seed, 538
        # changes) came from a separate Wikipedia-scraper pipeline with its
        # own team codes; rebuilding it here would overwrite that curated
        # data. Re-add once the pipelines are consolidated in this repo.
        league: [MLB, NHL, CFB]
    runs-on: ubuntu-latest
    # These three have fast, well-behaved sources and finish in minutes even
    # cold; a tight cap just guards against a hung request eating the budget.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: linealchamp-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: linealchamp-data/cache/${{ matrix.league }}
          key: source-cache-v1-${{ matrix.league }}-${{ github.run_id }}
          restore-keys: |
            source-cache-v1-${{ matrix.league }}-
      - run: pip install -r requirements.txt
      - name: Build lineage (${{ matrix.league }})
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python build_lineage.py --leagues ${{ matrix.league }}
      - name: Upload to Worker KV (${{ matrix.league }})
        if: ${{ !cancelled() }}
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: python upload_to_worker.py --leagues ${{ matrix.league }}
      # Bank fetched data even when the job fails or times out.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: linealchamp-data/cache/${{ matrix.league }}
          key: source-cache-v1-${{ matrix.league }}-${{ github.run_id }}
