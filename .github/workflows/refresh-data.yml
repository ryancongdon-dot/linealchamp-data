name: Refresh lineal data

# Keeps each league current by INCREMENTAL catch-up (update_recent.py): read
# the chain already on the Worker, fetch only the games since the last change,
# extend it, re-upload. It does NOT re-download decades of history — past games
# never change, so the old full-rebuild was pure waste and, for the
# rate-limited EPL endpoint, is what dragged runs to 3h and drained the monthly
# Actions budget.
#
# A full rebuild from a league's seed year is a separate, deliberate action:
# run build_lineage.py + upload_to_worker.py by hand (locally or via the
# Backfill workflow) only for a first backfill or a data correction.
#
# WEEKLY, not nightly: day-to-day currency already comes free from the Worker's
# own Cloudflare cron; this only needs to catch completed seasons. 2,000 free
# Actions minutes/month is plenty for a weekly incremental run.
#
# Required repository secrets:
#   BDL_API_KEY    balldontlie key (NBA + EPL)
#   CFBD_API_KEY   collegefootballdata.com key (CFB)
#   ADMIN_SECRET   the Worker's env.ADMIN_SECRET (authorizes the KV upload)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

concurrency: refresh-data

jobs:
  refresh-bdl:
    strategy:
      fail-fast: false
      max-parallel: 1  # NBA and EPL share one balldontlie key — don't compete
      matrix:
        league: [NBA, EPL]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: linealchamp-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: linealchamp-data/cache/${{ matrix.league }}
          key: source-cache-v1-${{ matrix.league }}-${{ github.run_id }}
          restore-keys: |
            source-cache-v1-${{ matrix.league }}-
      - run: pip install -r requirements.txt
      - name: Incremental update (${{ matrix.league }})
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: python update_recent.py --leagues ${{ matrix.league }}
      # Bank the recent-season cache even on timeout, so a capped run still
      # makes forward progress.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: linealchamp-data/cache/${{ matrix.league }}
          key: source-cache-v1-${{ matrix.league }}-${{ github.run_id }}

  refresh-other:
    strategy:
      fail-fast: false
      matrix:
        # NFL is deliberately excluded: its live chain (1933 Bears seed, 538
        # changes) came from a separate Wikipedia-scraper pipeline with its
        # own team codes; catching it up here would need that pipeline's
        # source. Re-add once the pipelines are consolidated in this repo.
        league: [MLB, NHL, CFB]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: linealchamp-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: linealchamp-data/cache/${{ matrix.league }}
          key: source-cache-v1-${{ matrix.league }}-${{ github.run_id }}
          restore-keys: |
            source-cache-v1-${{ matrix.league }}-
      - run: pip install -r requirements.txt
      - name: Incremental update (${{ matrix.league }})
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: python update_recent.py --leagues ${{ matrix.league }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: linealchamp-data/cache/${{ matrix.league }}
          key: source-cache-v1-${{ matrix.league }}-${{ github.run_id }}
