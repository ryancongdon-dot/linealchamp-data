# Cloudflare Worker config for linealchamp-api.
#
# Once worker.js lands in this directory, every push to main auto-deploys via
# .github/workflows/deploy-worker.yml — no more pasting code into the
# Cloudflare dashboard editor.
#
# kv_namespaces.id is the LINEALCHAMP namespace
# (dash.cloudflare.com → Storage & Databases → KV).
#
# Secrets (ADMIN_SECRET, API keys) already set on the deployed worker are
# preserved across wrangler deploys — no need to re-enter them.

name = "linealchamp-api"
main = "worker.js"
compatibility_date = "2026-01-01"

# Hourly cron — replaces the every-few-minutes schedule that was burning
# through the free tier's 1,000 KV writes/day.
[triggers]
crons = ["0 * * * *"]

kv_namespaces = [
  { binding = "KV", id = "f1e34c5b4dbd41c9b8e92a1427c90969" }
]

# If the thelinealchamp.com custom domain ever detaches after a deploy,
# uncomment and adjust:
# routes = [
#   { pattern = "thelinealchamp.com", custom_domain = true }
# ]
